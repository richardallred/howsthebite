# Tests every change, then publishes it to Cloudflare Pages.
#
# - Pull request: deploys a preview at https://pr-<number>.howsthebite.pages.dev (plus a
#   per-commit address). It never touches howsthebite.io. The link appears as
#   "View deployment" on the PR and in the run summary.
# - Push to main: deploys to production (howsthebite.io).
# - Pull request merged or closed: deletes that PR's preview deployments.
#
# Nothing is deployed unless the unit and browser tests pass.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the "howsthebite" Pages project
# See "Deploying to Cloudflare Pages" in the README.

name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch: # re-deploy main by hand from the Actions tab

# One run per PR or branch at a time. A new push to a PR cancels the older run, and closing
# the PR cancels a preview deploy still in flight, so it cannot land after the cleanup.
# Production deploys queue instead, so they always finish in commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pull requests from forks and from Dependabot get no secrets, so they are tested but not
    # deployed.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write # the preview link comment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pages treats "main" as the production branch; any other name is a preview.
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          npx wrangler pages deploy dist \
            --project-name=howsthebite \
            --branch="$BRANCH" \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | cut -c1-200)" \
            --commit-dirty=false

          result=$(grep '"pages-deploy-detailed"' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          deployment_url=$(jq -r '.url // empty' <<<"$result")
          alias_url=$(jq -r '.alias // empty' <<<"$result")

          if [ "$BRANCH" = main ]; then
            url=https://howsthebite.io
          else
            url=${alias_url:-$deployment_url}
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Deployed to ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}"
            echo
            echo "- Site: $url"
            echo "- This exact build: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deployment responds
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            headers=$(curl -sS -o /dev/null -D - --max-time 15 "$URL/" || true)
            if grep -qi '^HTTP/[0-9.]* 200' <<<"$headers" && grep -qi '^content-security-policy:' <<<"$headers"; then
              echo "$URL is up with its security headers"
              exit 0
            fi
            echo "Not ready yet (attempt $attempt), retrying..."
            sleep 10
          done
          echo "::error::$URL did not return 200 with a Content-Security-Policy header"
          echo "$headers"
          exit 1

      # One comment per PR, edited in place on every push rather than re-posted.
      - name: Comment the preview link on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- howsthebite-preview -->';
            const { URL, DEPLOYMENT_URL, SHA } = process.env;
            const body = [
              marker,
              '### Preview deployed',
              '',
              `**${URL}**`,
              '',
              `This commit (\`${SHA.slice(0, 7)}\`) on its own: ${DEPLOYMENT_URL}`,
              '',
              '<sub>Updated on every push. Deleted when this PR is merged or closed.</sub>',
            ].join('\n');
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

  cleanup-preview:
    name: Delete preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      deployments: write
      pull-requests: write # update the preview link comment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Delete this PR's preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: pr-${{ github.event.pull_request.number }}
        run: node scripts/delete-preview-deployments.mjs --branch "$BRANCH"

      # Marks the PR's "preview" deployment as gone, so its View deployment button is retired.
      - name: Mark the GitHub deployment inactive
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const refs = new Set([pr.head.ref, `refs/heads/${pr.head.ref}`, `refs/pull/${pr.number}/merge`]);
            const all = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'preview', per_page: 100,
            });
            const mine = all.filter((d) => refs.has(d.ref));
            for (const d of mine) {
              await github.rest.repos.createDeploymentStatus({ ...context.repo, deployment_id: d.id, state: 'inactive' });
            }
            core.info(`Marked ${mine.length} deployment(s) for PR #${pr.number} inactive`);

      - name: Update the preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- howsthebite-preview -->';
            const pr = context.payload.pull_request;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (!existing) return;
            const body = [
              marker,
              '### Preview deleted',
              '',
              `The preview for this PR was removed when it was ${pr.merged ? 'merged' : 'closed'}.`,
              pr.merged ? 'The change is deploying to https://howsthebite.io.' : '',
            ].join('\n');
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
